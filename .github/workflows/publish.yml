name: Publish Package

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tags like v1.0.0
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        working-directory: tools/k-sdd
        run: npm ci

      - name: Build
        working-directory: tools/k-sdd
        run: npm run build --if-present

      - name: Test
        working-directory: tools/k-sdd
        run: npm test --if-present

      - name: Check if version already published
        id: version_check
        working-directory: tools/k-sdd
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "k-sdd@$LOCAL_VERSION" version > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::k-sdd@$LOCAL_VERSION is already published. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version_check.outputs.already_published == 'false'
        working-directory: tools/k-sdd
        run: npm publish --provenance
